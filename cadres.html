<html lang="fr">
<head>

  <style>
    * {
      margin: 0;

      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f4f9ff;
      padding: 40px;
      display: flex;
    }

    .sidebar {
  width: 280px;
  background: #ffffff;
  color: #0d47a1;
  display: flex;
  flex-direction: column;
  padding: 30px 20px;
  box-shadow: 2px 0 15px rgba(0, 0, 0, 0.1);
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  overflow-y: auto; 


    .main-content {
      margin-left: 300px;
      flex: 1;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .logo img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .title {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #c21616;
      margin-bottom: 30px;
    }

    .title span {
      display: block;
      font-size: 13px;
      color: #333;
      font-weight: 500;
    }

    .nav-button {
      padding: 14px 20px;
      margin: 10px 0;
      background-color: #e3f2fd;
      border: none;
      color: #0d47a1;
      font-weight: 600;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-button:hover {
      background-color: #bbdefb;
      transform: translateX(5px);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(33, 150, 243, 0.1);
      margin-bottom: 40px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #0d47a1;
      margin-bottom: 25px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      background-color: #0d47a1;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 10px;
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 13px;
      background-color: #1565c0;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #e0e0e0;
  word-wrap: break-word;
  white-space: normal;
}


    th {
      background-color: #e3f2fd;
      color: #0d47a1;
      font-weight: 600;
    }

    .employee-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 15px;
    }




    






    .icon-button {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #0d47a1;
  transition: transform 0.2s ease;
}

.icon-button:hover {
  transform: scale(1.2);
}



.nav-button.active {
  background-color: #bbdefb;
  border-left: 4px solid #0d47a1;
  font-weight: 700;
}

  </style>
</head>
<body>

    </div>
    <div class="title">

      et de la Promotion des Exportations
      <span>Direction du Commerce – Guelma –</span>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; margin-top: auto;">
      <button onclick="toggleLanguage()" title="Changer la langue" class="icon-button">🌐</button>
    </div>
    
    <!-- Accueil -->
<button class="nav-button" onclick="setActivePage(this)" data-page="index.html">
  Accueil <br> الصفحة الرئيسية
</button>

<!-- Gestion des Employés -->
<button class="nav-button" onclick="toggleEmployes()">Gestion des Employés <br> ادارة الموظفين</button>
<div id="employes-submenu" style="display: none; margin-left: 10px;">
  <button class="nav-button" onclick="setActivePage(this)" data-page="cadres.html">Cadres supérieurs<br>موظفين المناصب العليا</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="commun.html">Agents du corps commun<br>موظفين السلك المشترك</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="contractuels.html">Agents contractuels<br>الموظفين المتعاقدين</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="concurrence.html">Agents de la concurrence<br>موظفي المنافسة</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="fraude.html">Agents de la répression des fraudes<br>موظفي قمع الغش</button>
</div>

<!-- Gestion des Congés -->
<button class="nav-button" onclick="toggleConges()">Gestion des Congés<br>إدارة الإجازات</button>
<div id="conges-submenu" style="display: none; margin-left: 10px;">
  <button class="nav-button" onclick="setActivePage(this)" data-page="maternité.html">Congé de maternité<br>عطلة الأمومة</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="maladie.html">Congé de maladie<br>عطلة مرضية</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="annuel.html">Congé annuel<br>العطلة السنوية</button>

<!-- Other buttons -->
<button class="nav-button" onclick="setActivePage(this)" data-page="sanctions.html">Gestion des sanctions <br> ادارة العقوبات </button>

<div id="promotions-submenu" style="display: none; margin-left: 10px;">
  <button class="nav-button" onclick="setActivePage(this)" data-page="document-promotion.html">Document de promotion<br>وثيقة الترقية</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="rapport-notation.html">Rapport de notation des employés<br>كشف التنقيط </button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="grade.html">Grade<br>الرتبة</button>

</div>

<div id="dossiers-submenu" style="display: none; margin-left: 10px;">
  <button class="nav-button" onclick="setActivePage(this)" data-page="attestation.html">Attestation de travail<br>شهادة العمل</button>
  <button class="nav-button" onclick="setActivePage(this)" data-page="pv-installation.html">PV d'installation<br>محضر التنصيب</button>
</div>
    
  </div>

  <div class="main-content">
    <div class="container">
      <h1>Employés Actuels</h1>
      <div class="actions">
        <button class="btn" onclick="window.location.href='ajouter-employe.html'">➕ Nouveau Employé</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nom & Prénom</th>
            <th>Date Naissance</th>
            <th>Lieu Naissance</th>
            <th>Date Recrutement</th>
            <th>Grade</th>
            <th>Fonction</th>
            <th>Obs</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="currentEmployees">
          <tr>
            <td><input type="text" value="Ahmed Bensalah"></td>
            <td><input type="text" value="12/04/1985"></td>
            <td><input type="text" value="Guelma"></td>
            <td><input type="text" value="15/06/2010"></td>
            <td><input type="text" value="Inspecteur"></td>
            <td><input type="text" value="Chef de Service"></td>
            <td><input type="text" value="-"></td>
            <td class="employee-actions">
              
              <button class="btn btn-small" onclick="editEmploye(this)">Éditer</button>
              <button class="btn btn-small" onclick="archiverEmploye(this)">Archiver</button>
              <button class="btn btn-small" onclick="profile(this)">Profile</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="container">
      <h1>Employés Archivés</h1>
      <table>
        <thead>
          <tr>
            <th>Nom & Prénom</th>
            <th>Date Naissance</th>
            <th>Lieu Naissance</th>
            <th>Date Recrutement</th>
            <th>Grade</th>
            <th>Fonction</th>
            <th>Obs</th>
          </tr>
        </thead>
        <tbody id="archivedEmployees">
          <!-- Employés Archivés -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const currentEmployees = document.getElementById("currentEmployees");
    const archivedEmployees = document.getElementById("archivedEmployees");

    function ajouterEmploye() {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><input type="text" placeholder="Nom & Prénom"></td>
        <td><input type="text" placeholder="Date de Naissance"></td>
        <td><input type="text" placeholder="Lieu de Naissance"></td>
        <td><input type="text" placeholder="Date de Recrutement"></td>
        <td><input type="text" placeholder="Grade"></td>
        <td><input type="text" placeholder="Fonction"></td>
        <td><input type="text" placeholder="Obs"></td>
        <td class="employee-actions">
          <button class="btn btn-small" onclick="profile(this)">profile</button>
          <button class="btn btn-small" onclick="editEmploye(this)">Éditer</button>
          <button class="btn btn-small" onclick="archiverEmploye(this)">Archiver</button>
        </td>
      `;
      currentEmployees.appendChild(row);
    }

    function profile(button) {
      const row = button.closest("tr");
      const name = row.querySelector("td input")?.value || "";
      if (name) {
        window.location.href = `profile.html?employe=${encodeURIComponent(name)}`;
      } else {
        alert("Veuillez d'abord saisir le nom de l'employé.");
      }
    }

    function archiverEmploye(btn) {
      const row = btn.closest("tr");
      const inputs = row.querySelectorAll("input");
      const archivedRow = document.createElement("tr");

      archivedRow.innerHTML = `
        <td>${inputs[0].value}</td>
        <td>${inputs[1].value}</td>
        <td>${inputs[2].value}</td>
        <td>${inputs[3].value}</td>
        <td>${inputs[4].value}</td>
        <td>${inputs[5].value}</td>
        <td>${inputs[6].value}</td>
      `;

      archivedEmployees.appendChild(archivedRow);
      row.remove();
    }

    function editEmploye(btn) {
      const row = btn.closest("tr");
      const inputs = row.querySelectorAll("input");
      inputs.forEach(input => input.removeAttribute("readonly"));
      inputs.forEach(input => input.focus());
    }
  </script>
<script>
  function toggleConges() {
  const submenu = document.getElementById('conges-submenu');
  submenu.style.display = submenu.style.display === 'none' ? 'block' : 'none';
}

</script>
<script>
  

function toggleLanguage() {
  const currentLang = document.documentElement.lang;
  const isFrench = currentLang === 'fr';
  document.documentElement.lang = isFrench ? 'ar' : 'fr';
  document.body.dir = isFrench ? 'rtl' : 'ltr';

  const labels = isFrench
    ? {
        "Employés Actuels": "الموظفون الحاليون",
        "Employés Archivés": "الموظفون المؤرشفون",
        "➕ Nouveau Employé": "➕ موظف جديد"
      }
    : {
        "الموظفون الحاليون": "Employés Actuels",
        "الموظفون المؤرشفون": "Employés Archivés",
        "➕ موظف جديد": "➕ Nouveau Employé"
      };

  document.querySelector("h1").textContent = labels[document.querySelector("h1").textContent] || document.querySelector("h1").textContent;
  document.querySelectorAll("h1")[1].textContent = labels[document.querySelectorAll("h1")[1].textContent] || document.querySelectorAll("h1")[1].textContent;
  document.querySelector(".btn").textContent = labels[document.querySelector(".btn").textContent] || document.querySelector(".btn").textContent;
}

</script>
<script>
  function toggleEmployes() {
  const submenu = document.getElementById("employes-submenu");
  submenu.style.display = submenu.style.display === "none" ? "block" : "none";
}

</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
  const currentPage = window.location.pathname.split("/").pop();
  const buttons = document.querySelectorAll(".nav-button");

  buttons.forEach(btn => {
    const page = btn.getAttribute("data-page");
    if (page === currentPage) {
      btn.classList.add("active");

      // 🧠 If it's a submenu button, expand its parent section
      const parentMenu = btn.closest("#employes-submenu, #conges-submenu");
      if (parentMenu) {
        parentMenu.style.display = "block";
      }
    }
  });
});

function setActivePage(button) {
  const page = button.getAttribute("data-page");
  localStorage.setItem("activePage", page);
  window.location.href = page;
}

</script>
<script>
  function togglePromotions() {
  const submenu = document.getElementById("promotions-submenu");
  submenu.style.display = submenu.style.display === "none" ? "block" : "none";
}

</script>
<script>
  function toggleDossiers() {
  const submenu = document.getElementById("dossiers-submenu");
  submenu.style.display = submenu.style.display === "none" ? "block" : "none";
}


</script>
</body>
</html>
